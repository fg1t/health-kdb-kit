# ── General ───────────────────────────────────────────────────────────────────
# Click a pane to focus it; drag a pane border to resize.
set -g mouse on

# Prefix: Ctrl-s (herdr, the daily interactive mux, has its own leader; ctrl+s
# needs `stty -ixon` in .zshrc so the terminal doesn't eat it as XOFF).
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Scrollback with PageUp / PageDown
bind -n PageUp copy-mode -u
bind -n PageDown send-keys PageDown

# ── Fai orchestration (window-per-context, detached workers) ───────────────────
# Windows/panes count from 1 to match the prefix number-jump muscle memory.
set -g base-index 1
setw -g pane-base-index 1
# Closing a finished worker window renumbers the rest so numbers stay contiguous.
set -g renumber-windows on
# Fai names each window by context_id; keep a running command from clobbering it.
set -g allow-rename off
setw -g automatic-rename off
# Fai reads live workers via capture-pane; keep plenty of scrollback.
set -g history-limit 50000
# Surface a detached worker pane that printed output (no noisy bell).
setw -g monitor-activity on
set -g visual-activity off
# vi keys in copy-mode (matches the vim-style pane nav below).
setw -g mode-keys vi
# Snappier leader; propagate focus to editors/shell integration.
set -sg escape-time 10
set -g focus-events on
# OSC 52: copy inside tmux reaches the outer terminal's clipboard (useful when
# tmux runs on a remote machine over SSH).
set -g set-clipboard on

# ── Colors ────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Catppuccin Mocha theme (matches Ghostty) ───────────────────────────────────
set -g status-style bg=#181825,fg=#cdd6f4
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#a6e3a1,bold] #S #[fg=#6c7086]│ "
set -g status-right "#[fg=#89b4fa] %H:%M #[fg=#6c7086]│ #[fg=#a6e3a1] #h "

setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
setw -g window-status-format "#[fg=#6c7086] #I:#W "

# ── Pane navigation ───────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style fg=#585b70
set -g pane-active-border-style fg=#89b4fa

# ── Machine-local overrides (NOT chezmoi-managed; never synced) ────────────────
# if-shell form so even an ancient tmux handles a missing file quietly.
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
